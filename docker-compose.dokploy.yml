services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL must be set in Dokploy Environment}
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
