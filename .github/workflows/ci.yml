name: Frontend CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  IMAGE: ghcr.io/nsa09-nsa09/ecopay-frontend

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Release gate
        run: npm run release:gate

      - name: Source map/security scan
        run: node -e "const fs=require('fs'); const path=require('path'); const hits=[]; const walk=d=>fs.readdirSync(d,{withFileTypes:true}).forEach(e=>{const p=path.join(d,e.name); if(e.isDirectory()) walk(p); else if(p.endsWith('.map')) hits.push(p)}); walk('dist'); if(hits.length){console.error(hits.join('\n')); process.exit(1)}"

  docker-build-push:
    needs: release-gate
    if: needs.release-gate.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: docker-build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: frontend-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Compute target
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "service=frontend" >> "$GITHUB_OUTPUT"
            echo "public_url_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "service=frontend-dev" >> "$GITHUB_OUTPUT"
            echo "public_url_required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate public URL config
        env:
          FRONTEND_PUBLIC_URL: ${{ vars.FRONTEND_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ "${{ steps.target.outputs.public_url_required }}" = "true" ] && [ -z "${FRONTEND_PUBLIC_URL:-}" ]; then
            echo "::error::FRONTEND_PUBLIC_URL is not configured for the production GitHub Environment"
            exit 1
          fi
          if [ -n "${FRONTEND_PUBLIC_URL:-}" ] && ! printf '%s' "$FRONTEND_PUBLIC_URL" | grep -Eq '^https?://'; then
            echo "::error::FRONTEND_PUBLIC_URL must start with http:// or https://"
            exit 1
          fi

      - name: Deploy exact SHA to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/ecopay
            export FRONTEND_IMAGE="${{ env.IMAGE }}:${{ github.sha }}"
            docker compose pull ${{ steps.target.outputs.service }}
            docker compose up -d ${{ steps.target.outputs.service }}
            for i in $(seq 1 30); do
              if docker compose exec -T ${{ steps.target.outputs.service }} sh -c "wget -qO- http://127.0.0.1/healthz" | grep -q '^ok'; then
                exit 0
              fi
              sleep 5
            done
            docker compose ps ${{ steps.target.outputs.service }}
            docker compose logs --no-color --tail=100 ${{ steps.target.outputs.service }}
            exit 1

      - name: Public HTTP smoke
        env:
          FRONTEND_PUBLIC_URL: ${{ vars.FRONTEND_PUBLIC_URL }}
        run: |
          set -euo pipefail
          base="${FRONTEND_PUBLIC_URL:-}"
          if [ -z "$base" ]; then
            if [ "${{ steps.target.outputs.public_url_required }}" = "true" ]; then
              echo "::error::FRONTEND_PUBLIC_URL is not configured"
              exit 1
            fi
            echo "::notice::FRONTEND_PUBLIC_URL is not configured; internal deployment-host health check already passed"
            exit 0
          fi
          base="${base%/}"
          for i in {1..30}; do
            if curl -fsS "$base/healthz" | grep -q '^ok'; then
              break
            fi
            sleep 5
            if [ "$i" = "30" ]; then exit 1; fi
          done
          curl -fsS "$base/" | grep -qi '<div id="root"'
