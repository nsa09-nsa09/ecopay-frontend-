# Processed by nginx:1.27-alpine's envsubst at container startup.
# Only ${BACKEND_HOST} is substituted (whitelisted via NGINX_ENVSUBST_FILTER);
# all other $variables remain intact for nginx itself to resolve at request time.
#
# BACKEND_HOST defaults to "backend:8080" — the Spring Boot service name on
# the dokploy-network. Override via Dokploy Environment if your backend
# service is named differently (e.g. ecopay-backend:8080).

# Docker's embedded DNS so the backend service name is resolvable at runtime.
resolver 127.0.0.11 ipv6=off valid=10s;

log_format ecopay_no_query '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent"';

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Lift static-file body size limit so avatar uploads (multipart) can pass
  # through without nginx-level 413s before the backend gets the request.
  client_max_body_size 10m;

  # Compress text-ish payloads. Assets are cached forever so the cost is paid
  # once per file per client. Binary formats (png/jpg/pdf) are excluded — they
  # already ship compressed.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  # JSON REST API — proxied to the Spring Boot backend on dokploy-network.
  location /api/ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;
    add_header X-Frame-Options "DENY" always;
    proxy_pass http://${BACKEND_HOST};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # WebSocket endpoint (STOMP over WS) — needs explicit Upgrade headers
  # otherwise the handshake silently fails.
  location /ws {
    access_log /var/log/nginx/access.log ecopay_no_query;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;
    add_header X-Frame-Options "DENY" always;
    proxy_pass http://${BACKEND_HOST};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Vite's hashed assets — content-addressable, safe to cache for a year.
  # Files are named like /assets/index-<hash>.js so a new deploy invalidates
  # naturally via a different URL.
  location /assets/ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.map$ {
    return 404;
  }

  # SPA fallback — every unknown path is served by index.html so react-router
  # can take over. This is also the HTML entry point, so the browser security
  # headers live here (the backend only sets them on /api). index.html itself
  # ships with no-cache so a fresh deploy is picked up on the next reload
  # without waiting for a CDN or browser cache to expire.
  location / {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
